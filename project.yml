name: QuotaGlance
options:
  bundleIdPrefix: com.liangrui
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "12.0"
packages:
  QuotaGlanceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  QuotaGlance:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - QuotaGlance.entitlements
          - Assets.xcassets
      - path: App/Assets.xcassets
    dependencies:
      - package: QuotaGlanceCore
        product: QuotaGlanceCore
      - target: QuotaGlanceWidget
        embed: true
      - target: QuotaGlanceNCWidget
        embed: true
      - target: QuotaGlanceNCIntents
        embed: true
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.liangrui.QuotaGlance
        PRODUCT_NAME: QuotaGlance
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/QuotaGlance.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  QuotaGlanceLegacy:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - QuotaGlance.entitlements
          - Assets.xcassets
      - path: App/Assets.xcassets
    dependencies:
      - package: QuotaGlanceCore
        product: QuotaGlanceCore
      - target: QuotaGlanceNCWidget
        embed: true
      - target: QuotaGlanceNCIntents
        embed: true
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.liangrui.QuotaGlance
        PRODUCT_NAME: QuotaGlance
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/QuotaGlance.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  QuotaGlanceWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - QuotaGlanceWidget.entitlements
    dependencies:
      - package: QuotaGlanceCore
        product: QuotaGlanceCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.liangrui.QuotaGlance.Widget
        PRODUCT_NAME: QuotaGlanceWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/QuotaGlanceWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  QuotaGlanceNCWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: NCWidget
        excludes:
          - Info.plist
          - QuotaGlanceNCWidget.entitlements
          - NCWidgetAccountIntent.intentdefinition
      # Shipped as a bundled resource only (no codegen) so the hand-written
      # NCWidgetAccountIntent classes in NCWidgetAccountIntent+Generated.swift
      # remain the single source of truth. See that file for rationale.
      - path: NCWidget/NCWidgetAccountIntent.intentdefinition
        buildPhase: resources
    dependencies:
      - package: QuotaGlanceCore
        product: QuotaGlanceCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.liangrui.QuotaGlance.NCWidget
        PRODUCT_NAME: QuotaGlanceNCWidget
        INFOPLIST_FILE: NCWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NCWidget/QuotaGlanceNCWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  QuotaGlanceNCIntents:
    type: app-extension
    platform: macOS
    sources:
      - path: NCIntents
        excludes:
          - Info.plist
          - QuotaGlanceNCIntents.entitlements
      # Shared with QuotaGlanceNCWidget so both extensions agree on the
      # intent's shape without Xcode generating conflicting classes twice.
      - path: NCWidget/NCWidgetAccountIntent.intentdefinition
        buildPhase: resources
      - path: NCWidget/NCWidgetAccountIntent+Generated.swift
      - path: NCWidget/NCWidgetAccountIntentChoice.swift
    dependencies:
      - package: QuotaGlanceCore
        product: QuotaGlanceCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.liangrui.QuotaGlance.NCIntents
        PRODUCT_NAME: QuotaGlanceNCIntents
        INFOPLIST_FILE: NCIntents/Info.plist
        CODE_SIGN_ENTITLEMENTS: NCIntents/QuotaGlanceNCIntents.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  QuotaGlance:
    build:
      targets:
        QuotaGlance: all
    run:
      config: Debug
    archive:
      config: Release
  QuotaGlanceWidget:
    build:
      targets:
        QuotaGlanceWidget: all
  QuotaGlanceNCWidget:
    build:
      targets:
        QuotaGlanceNCWidget: all
  QuotaGlanceNCIntents:
    build:
      targets:
        QuotaGlanceNCIntents: all
  QuotaGlanceLegacy:
    build:
      targets:
        QuotaGlanceLegacy: all
    run:
      config: Debug
    archive:
      config: Release
