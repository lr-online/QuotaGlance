name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi

      # Windows assets are generated and ignored, but global parity verifies
      # them alongside the Swift and HarmonyOS copies.
      - name: Sync Windows parity inputs
        run: |
          /bin/bash scripts/sync-specs-to-windows.sh
          /bin/bash scripts/sync-contracts-to-windows.sh

      - name: Run Swift tests
        run: swift test

      - name: Verify provider parity
        run: /bin/bash scripts/verify-provider-parity.sh

      - name: Run provider parity tests
        run: /bin/bash Tests/ScriptTests/ProviderParityTests.sh

      - name: Verify HarmonyOS string key parity
        run: /bin/bash Tests/ScriptTests/HarmonyOSStringParityTests.sh

      - name: Verify app icon assets
        run: /bin/bash Tests/ScriptTests/AppIconTests.sh

      - name: Verify GitHub Actions contracts
        run: /bin/bash Tests/ScriptTests/GitHubActionsTests.sh

      - name: Verify build editions
        run: /bin/bash Tests/ScriptTests/BuildEditionTests.sh

      - name: Verify DMG packaging
        run: /bin/bash Tests/ScriptTests/DMGPackagingTests.sh

      - name: Verify release version helper
        run: /bin/bash Tests/ScriptTests/ReleaseVersionTests.sh

      - name: Verify local install safety
        run: /bin/bash Tests/ScriptTests/LocalInstallSafetyTests.sh
