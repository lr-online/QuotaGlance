name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag in vX.Y.Z form
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected tag
        id: version
        env:
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          metadata="$(bash scripts/release-version.sh "$SELECTED_TAG")"
          git fetch --force --tags origin
          tag_commit="$(git rev-parse -q --verify "refs/tags/$SELECTED_TAG^{commit}")"
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]] || {
            echo "Selected tag does not match the checked-out commit: $SELECTED_TAG" >&2
            exit 1
          }
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi

      # Windows assets are generated and ignored, but the global parity check
      # consumes them.
      - name: Sync Windows parity inputs
        run: |
          /bin/bash scripts/sync-specs-to-windows.sh
          /bin/bash scripts/sync-contracts-to-windows.sh

      - name: Run Swift tests
        run: swift test

      - name: Verify provider parity
        run: /bin/bash scripts/verify-provider-parity.sh

      - name: Verify app icon assets
        run: /bin/bash Tests/ScriptTests/AppIconTests.sh

      - name: Verify build editions
        run: /bin/bash Tests/ScriptTests/BuildEditionTests.sh

      - name: Verify DMG packaging
        run: /bin/bash Tests/ScriptTests/DMGPackagingTests.sh

      - name: Verify release version helper
        run: /bin/bash Tests/ScriptTests/ReleaseVersionTests.sh

      - name: Verify local install safety
        run: /bin/bash Tests/ScriptTests/LocalInstallSafetyTests.sh

      - name: Package release DMGs
        env:
          QUOTAGLANCE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/package-dmg.sh dist all

      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-macOS-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android API 36 build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # The global parity check also compares ignored Windows generated assets.
      - name: Sync parity inputs
        run: |
          bash scripts/sync-specs-to-android.sh
          bash scripts/sync-contracts-to-android.sh
          bash scripts/sync-specs-to-windows.sh
          bash scripts/sync-contracts-to-windows.sh

      - name: Verify contract parity
        run: |
          bash scripts/verify-provider-parity.sh
          bash scripts/verify-android-parity.sh

      - name: Test, lint, and build release APK
        working-directory: Android
        env:
          QUOTAGLANCE_VERSION: ${{ needs.prepare.outputs.version }}
          QUOTAGLANCE_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleRelease \
            -PquotaglanceVersion="$QUOTAGLANCE_VERSION" \
            -PquotaglanceVersionCode="$QUOTAGLANCE_VERSION_CODE"

      - name: Name Android release asset
        env:
          QUOTAGLANCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="dist/QuotaGlance-${QUOTAGLANCE_VERSION}-android-universal.apk"
          cp Android/app/build/outputs/apk/release/app-release.apk "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload Android release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-Android-${{ needs.prepare.outputs.version }}
          path: |
            dist/*-android-universal.apk
            dist/*-android-universal.apk.sha256
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            winget install --id Rustlang.Rustup -e --accept-package-agreements --accept-source-agreements
          }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Windows/package-lock.json

      - name: Sync spec + contract sources into Windows assets
        shell: bash
        run: |
          bash scripts/sync-specs-to-windows.sh
          bash scripts/sync-contracts-to-windows.sh

      - name: Install front-end dependencies
        working-directory: Windows
        shell: pwsh
        run: npm ci

      - name: Generate Windows icon assets
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/generate-windows-icons.ps1

      - name: Verify provider parity (Swift / ArkTS / Kotlin / Rust)
        shell: bash
        run: bash scripts/verify-provider-parity.sh

      - name: Verify Windows-only parity
        shell: bash
        run: bash scripts/verify-windows-parity.sh

      - name: Cargo test (engine, aggregation, alerts)
        working-directory: Windows/src-tauri
        shell: pwsh
        run: cargo test --verbose

      - name: Build and name Windows release assets
        working-directory: Windows
        shell: pwsh
        env:
          QUOTAGLANCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $target = "x86_64-pc-windows-msvc"
          $windowsDirectory = $PWD.Path
          $tauriConfig = Join-Path $windowsDirectory "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw -LiteralPath $tauriConfig | ConvertFrom-Json
          $config.version = $env:QUOTAGLANCE_VERSION
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $tauriConfig -Encoding utf8

          npm exec -- tauri build --target $target --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $releaseDirectory = Join-Path $windowsDirectory "target/$target/release"
          $app = Get-ChildItem -Path $releaseDirectory -Filter "quotaglance.exe" -File | Select-Object -First 1
          if (-not $app) {
            throw "Tauri application executable was not produced in $releaseDirectory"
          }

          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $distDirectory | Out-Null
          $portableDirectory = Join-Path $env:RUNNER_TEMP "QuotaGlance-portable-x64"
          New-Item -ItemType Directory -Force -Path $portableDirectory | Out-Null
          Copy-Item -LiteralPath $app.FullName -Destination (Join-Path $portableDirectory "QuotaGlance.exe")
          @'
          @echo off
          setlocal
          set QUOTAGLANCE_PORTABLE=1
          start "" "%~dp0QuotaGlance.exe"
          '@ | Set-Content -LiteralPath (Join-Path $portableDirectory "Start QuotaGlance Portable.cmd") -Encoding ascii

          $portableAsset = Join-Path $distDirectory "QuotaGlance-$env:QUOTAGLANCE_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $portableDirectory "*") -DestinationPath $portableAsset -Force

          $bundleDirectory = Join-Path $releaseDirectory "bundle"
          $nsis = @(Get-ChildItem -Path (Join-Path $bundleDirectory "nsis") -Filter "*.exe" -File)
          if ($nsis.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($nsis.Count)"
          }
          $nsisAsset = Join-Path $distDirectory "QuotaGlance-$env:QUOTAGLANCE_VERSION-windows-x64-setup.exe"
          Copy-Item -LiteralPath $nsis[0].FullName -Destination $nsisAsset

          $msis = @(Get-ChildItem -Path (Join-Path $bundleDirectory "msi") -Filter "*.msi" -File)
          $msiAssets = @()
          foreach ($language in @("en-US", "zh-CN")) {
            $matches = @($msis | Where-Object { $_.Name -match "_$([regex]::Escape($language))\.msi$" })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one $language MSI installer, found $($matches.Count)"
            }
            $asset = Join-Path $distDirectory "QuotaGlance-$env:QUOTAGLANCE_VERSION-windows-x64-$language.msi"
            Copy-Item -LiteralPath $matches[0].FullName -Destination $asset
            $msiAssets += Get-Item -LiteralPath $asset
          }

          $assets = @((Get-Item -LiteralPath $portableAsset), (Get-Item -LiteralPath $nsisAsset)) + $msiAssets
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($asset.Name)" | Set-Content -LiteralPath "$($asset.FullName).sha256" -Encoding ascii
          }

          Get-ChildItem -Path $distDirectory -File | ForEach-Object {
            Write-Host "$($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-Windows-${{ needs.prepare.outputs.version }}
          path: |
            dist/*-windows-x64-*.zip
            dist/*-windows-x64-*.exe
            dist/*-windows-x64-*.msi
            dist/*-windows-x64-*.sha256
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - macos
      - android
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaGlance-macOS-${{ needs.prepare.outputs.version }}
          path: release-assets/macos

      - name: Download Android release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaGlance-Android-${{ needs.prepare.outputs.version }}
          path: release-assets/android

      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaGlance-Windows-${{ needs.prepare.outputs.version }}
          path: release-assets/windows

      - name: Generate release notes from commits
        env:
          SELECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          previous_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" == "$SELECTED_TAG" ]] && continue
            if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged "$SELECTED_TAG" --sort=-version:refname)

          {
            echo "## Changes"
            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --format='- %s (%h)' "$previous_tag..$SELECTED_TAG"
            else
              git log --no-merges --format='- %s (%h)' "$SELECTED_TAG"
            fi
          } > release-notes.md

          if [[ "$(wc -l < release-notes.md)" -eq 1 ]]; then
            echo "- No non-merge commits since the previous release." >> release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: QuotaGlance ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: |
            release-assets/macos/*.dmg
            release-assets/macos/*.dmg.sha256
            release-assets/android/*-android-universal.apk
            release-assets/android/*-android-universal.apk.sha256
            release-assets/windows/*-windows-x64-*.zip
            release-assets/windows/*-windows-x64-*.exe
            release-assets/windows/*-windows-x64-*.msi
            release-assets/windows/*-windows-x64-*.sha256
          fail_on_unmatched_files: true
