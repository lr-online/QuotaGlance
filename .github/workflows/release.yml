name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-14
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Run Swift tests
        run: swift test

      - name: Verify app icon assets
        run: /bin/bash Tests/ScriptTests/AppIconTests.sh

      - name: Verify build editions
        run: /bin/bash Tests/ScriptTests/BuildEditionTests.sh

      - name: Verify DMG packaging
        run: /bin/bash Tests/ScriptTests/DMGPackagingTests.sh

      - name: Verify local install safety
        run: /bin/bash Tests/ScriptTests/LocalInstallSafetyTests.sh

      - name: Package release DMGs
        env:
          QUOTAGLANCE_VERSION: ${{ github.ref_name }}
        run: ./scripts/package-dmg.sh

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuotaGlance-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          generate_release_notes: true
