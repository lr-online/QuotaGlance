name: Package

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to package
        type: choice
        options:
          - legacy
          - full
          - all
        default: legacy
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Run Swift tests
        run: swift test

      - name: Resolve package edition
        id: edition
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          REQUESTED_EDITION: ${{ inputs.edition }}
        run: |
          if [[ "$WORKFLOW_EVENT" == "workflow_dispatch" ]]; then
            echo "value=$REQUESTED_EDITION" >> "$GITHUB_OUTPUT"
          else
            echo "value=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Package DMGs
        env:
          PACKAGE_EDITION: ${{ steps.edition.outputs.value }}
        run: ./scripts/package-dmg.sh dist "$PACKAGE_EDITION"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
