name: Package

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to package
        type: choice
        options:
          - legacy
          - full
          - all
        default: legacy
  pull_request:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Run Swift tests
        run: swift test

      - name: Resolve package edition
        id: edition
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Package DMGs
        run: ./scripts/package-dmg.sh dist "${{ steps.edition.outputs.value }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuotaGlance-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
