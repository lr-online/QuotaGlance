name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Android/**"
      - "Contracts/**"
      - "scripts/sync-specs-to-android.sh"
      - "scripts/sync-contracts-to-android.sh"
      - "scripts/verify-android-parity.sh"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Android/**"
      - "Contracts/**"
      - "scripts/sync-specs-to-android.sh"
      - "scripts/sync-contracts-to-android.sh"
      - "scripts/verify-android-parity.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android API 35 build inputs
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Sync shared contracts
        run: |
          bash scripts/sync-specs-to-android.sh
          bash scripts/sync-contracts-to-android.sh

      - name: Verify contract parity
        run: |
          bash scripts/verify-provider-parity.sh
          bash scripts/verify-android-parity.sh

      - name: Test, lint, and build Android APKs
        working-directory: Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleDebug :app:assembleRelease

      - name: Upload Android APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-Android-${{ github.sha }}
          path: |
            Android/app/build/outputs/apk/debug/app-debug.apk
            Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android API 35 build inputs
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        run: |
          bash scripts/sync-specs-to-android.sh
          ./Android/gradlew --no-daemon -p Android :app:assembleRelease
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          cp Android/app/build/outputs/apk/release/app-release.apk "dist/QuotaGlance-${version}-android-universal.apk"
          sha256sum "dist/QuotaGlance-${version}-android-universal.apk" > "dist/QuotaGlance-${version}-android-universal.apk.sha256"

      - name: Publish Android release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3.0.0
        with:
          files: |
            dist/*-android-universal.apk
            dist/*-android-universal.apk.sha256
