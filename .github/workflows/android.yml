name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Android/**"
      - "Contracts/**"
      - "scripts/sync-specs-to-android.sh"
      - "scripts/sync-contracts-to-android.sh"
      - "scripts/verify-android-parity.sh"
      - "scripts/prepare-parity-resources.sh"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "Android/**"
      - "Contracts/**"
      - "scripts/sync-specs-to-android.sh"
      - "scripts/sync-contracts-to-android.sh"
      - "scripts/verify-android-parity.sh"
      - "scripts/prepare-parity-resources.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android API 36 build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Android and Windows parity inputs
        # prepare-parity-resources.sh runs bash scripts/sync-specs-to-android.sh,
        # bash scripts/sync-contracts-to-android.sh, bash scripts/sync-specs-to-windows.sh,
        # and bash scripts/sync-contracts-to-windows.sh as part of the seven-way sync.
        run: bash scripts/prepare-parity-resources.sh

      - name: Verify contract parity
        run: |
          bash scripts/verify-provider-parity.sh
          bash scripts/verify-android-parity.sh

      - name: Test, lint, and build Android APKs
        working-directory: Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleDebug :app:assembleRelease

      - name: Name Android artifacts
        id: metadata
        working-directory: Android
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^[[:space:]]*versionName = releaseVersionName ?: "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          fi
          [[ -n "$version" ]] || {
            echo "Unable to read Android versionName" >&2
            exit 1
          }
          short_sha="$(git rev-parse --short=12 HEAD)"
          mkdir -p ../dist
          for build_type in debug release; do
            source="app/build/outputs/apk/$build_type/app-$build_type.apk"
            target="../dist/QuotaGlance-${version}-android-${build_type}-${short_sha}.apk"
            cp "$source" "$target"
            sha256sum "$target" > "$target.sha256"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload Android APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-Android-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.short_sha }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
