name: HarmonyOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "HarmonyOS/**"
      - "Contracts/**"
      - "scripts/build-harmonyos.sh"
      - "scripts/sync-contracts-to-harmonyos.sh"
      - "scripts/verify-provider-parity.sh"
      - "Tests/ScriptTests/HarmonyOSWidgetInteractionTests.sh"
      - ".github/workflows/harmonyos.yml"
  push:
    branches:
      - main
    paths:
      - "HarmonyOS/**"
      - "Contracts/**"
      - "scripts/build-harmonyos.sh"
      - "scripts/sync-contracts-to-harmonyos.sh"
      - "scripts/verify-provider-parity.sh"
      - "Tests/ScriptTests/HarmonyOSWidgetInteractionTests.sh"
      - ".github/workflows/harmonyos.yml"

concurrency:
  group: harmonyos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Setup HarmonyOS CLI tools
        id: setup-ohos
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          # Matches HarmonyOS/build-profile.template.json5 targetSdkVersion 6.1.1(24)
          # and ErBWs/ohos-sdk release tags (command-line-tools + SDK mirror).
          version: 6.1.1.280
          cache: true

      - name: Configure SDK env for hvigor
        run: |
          set -euo pipefail
          echo "HOS_SDK_HOME=${HOS_SDK_HOME}"
          echo "DEVECO_SDK_HOME=${HOS_SDK_HOME}" >> "$GITHUB_ENV"
          echo "SDK tree (depth 3):"
          find "${HOS_SDK_HOME}" -maxdepth 3 -type d | sort | head -80
          test -f "${HOS_SDK_HOME}/default/sdk-pkg.json"
          test -f "${HOS_SDK_HOME}/default/openharmony/ets/oh-uni-package.json"
          test -f "${HOS_SDK_HOME}/default/hms/ets/uni-package.json"

      - name: Show toolchain versions
        run: |
          echo "HOS_SDK_HOME=${HOS_SDK_HOME}"
          echo "DEVECO_SDK_HOME=${DEVECO_SDK_HOME}"
          hvigorw -v
          ohpm -v
          node -v

      - name: Verify provider parity
        run: bash scripts/verify-provider-parity.sh

      - name: Sync shared contract fixtures
        run: bash scripts/sync-contracts-to-harmonyos.sh

      - name: Verify phone + tablet deviceTypes
        run: |
          set -euo pipefail
          MODULE=HarmonyOS/entry/src/main/module.json5
          grep -Fq '"phone"' "$MODULE"
          grep -Fq '"tablet"' "$MODULE"
          echo "deviceTypes include phone and tablet (Huawei Pad Mini)"

      - name: Verify widget interaction API support
        run: bash Tests/ScriptTests/HarmonyOSWidgetInteractionTests.sh

      - name: Build entry HAP
        env:
          HARMONYOS_BUILD_MODE: debug
          HARMONYOS_SKIP_SIGN: "1"
        run: bash scripts/build-harmonyos.sh

      - name: Upload HAP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaGlance-HarmonyOS-phone-tablet-${{ github.sha }}
          path: |
            HarmonyOS/entry/build/default/outputs/default/*.hap
            HarmonyOS/**/outputs/**/*.hap
          if-no-files-found: error
          retention-days: 14
